# docs/design/cicd.md §7. 주 1회, minor+patch는 묶고, 나온 지 7일 지난 버전만 올린다. 자동 머지는 없다.
# github-actions PR은 `uses: o/r@<sha> # <태그>` 형식을 유지한다(pin-check가 본다).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      cargo:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      npm:
        update-types: [minor, patch]
