# docs/design/cicd.md §7. 주 1회, minor+patch는 묶고, 나온 지 7일 지난 버전만 올린다. 자동 머지는 없다.
# 커밋 제목은 subjects gate 형식(`ci(deps): …`·`build(deps): …`)을 따른다(commit-message prefix).
# github-actions PR은 `uses: o/r@<sha> # <태그>` 형식을 유지한다(pin-check가 본다).
version: 2
updates:
  - package-ecosystem: github-actions
    commit-message:
      prefix: ci
      include: scope
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    commit-message:
      prefix: build
      include: scope
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      # hmac·sha2·digest는 같은 digest 메이저를 공유해야 해서 하나만 올리면 빌드가 깨진다(2026-10-06 #9·#11). 메이저도 함께 묶는다.
      rustcrypto:
        patterns: [hmac, sha2, digest]
      cargo:
        update-types: [minor, patch]

  - package-ecosystem: npm
    commit-message:
      prefix: build
      include: scope
    directory: /app
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    # @types/node는 지원 런타임(package.json engines: Node 22·24) 메이저를 넘기지 않는다. 넘으면 없는 API가 타입 검사를 통과한다.
    ignore:
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    groups:
      npm:
        update-types: [minor, patch]

  # Cloudflare Worker(worker/, docs/design/worker.md §13.3). 독립 lockfile. wrangler와 @cloudflare/*는 함께 올린다
  # (vitest 플러그인이 wrangler를 정확히 고정한다). vitest는 플러그인 peer(^4.1.0)가 열릴 때까지 메이저를 올리지 않는다.
  # wrangler 버전은 scripts/ci/tools.json과 같아야 한다(worker-config.mjs): 이 PR이 빨개지면 tools.json을 함께 고친다.
  # worker/deploy는 배포용 wrangler 하나만 담은 따로인 lockfile이다(release.yml worker-bundle, cicd.md 구현 중 변경 96). 같은 항목에
  # 두 폴더를 두어 그룹 cloudflare가 두 lockfile의 wrangler를 한 PR로 올린다(worker-config.mjs가 둘의 버전 불일치를 막는다).
  - package-ecosystem: npm
    commit-message:
      prefix: build
      include: scope
    directories:
      - /worker
      - /worker/deploy
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: vitest
        update-types: [version-update:semver-major]
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    groups:
      cloudflare:
        patterns: [wrangler, "@cloudflare/*"]
      msw:
        patterns: [msw, "@msw/*"]
      # design-worker(Worker 정적 HTML 스냅샷)의 Playwright·axe는 app과 같은 버전이어야 한다(worker-config.mjs가 app = worker =
      # tools.json playwright를 본다). 그룹은 /app 항목과 넘나들지 못해 PR이 둘로 온다: 하나만 빨개지면 둘과 tools.json을 함께 올린다
      playwright:
        patterns: ["@playwright/test", axe-core]
      npm:
        update-types: [minor, patch]
