# docs/design/cicd.md §7. 주 1회, minor+patch는 묶고, 나온 지 7일 지난 버전만 올린다. 자동 머지는 없다.
# 커밋 제목은 subjects gate 형식(`ci(deps): …`·`build(deps): …`)을 따른다(commit-message prefix).
# github-actions PR은 `uses: o/r@<sha> # <태그>` 형식을 유지한다(pin-check가 본다).
version: 2
updates:
  - package-ecosystem: github-actions
    commit-message:
      prefix: ci
      include: scope
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    commit-message:
      prefix: build
      include: scope
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      # hmac·sha2·digest는 같은 digest 메이저를 공유해야 해서 하나만 올리면 빌드가 깨진다(2026-10-06 #9·#11). 메이저도 함께 묶는다.
      rustcrypto:
        patterns: [hmac, sha2, digest]
      cargo:
        update-types: [minor, patch]

  - package-ecosystem: npm
    commit-message:
      prefix: build
      include: scope
    directory: /app
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    # @types/node는 지원 런타임(package.json engines: Node 22·24) 메이저를 넘기지 않는다. 넘으면 없는 API가 타입 검사를 통과한다.
    ignore:
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    groups:
      npm:
        update-types: [minor, patch]

  # Cloudflare Worker(worker/, docs/design/worker.md §13.3). 독립 lockfile. wrangler와 @cloudflare/*는 함께 올린다
  # (vitest 플러그인이 wrangler를 정확히 고정한다). vitest는 플러그인 peer(^4.1.0)가 열릴 때까지 메이저를 올리지 않는다.
  # wrangler 버전은 scripts/ci/tools.json과 같아야 한다(worker-config.mjs): 이 PR이 빨개지면 tools.json을 함께 고친다.
  - package-ecosystem: npm
    commit-message:
      prefix: build
      include: scope
    directory: /worker
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: vitest
        update-types: [version-update:semver-major]
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    groups:
      cloudflare:
        patterns: [wrangler, "@cloudflare/*"]
      msw:
        patterns: [msw, "@msw/*"]
      npm:
        update-types: [minor, patch]
