name: ci

# docs/design/cicd.md §2. 경로 필터를 두지 않는다: 필수 체크 ci-ok가 항상 보고되도록
# changes 작업이 바뀐 경로를 보고 무거운 작업만 건너뛴다(문서만 바뀌면 lint만 돈다).
# 모든 run:은 setup(autocrlf·rustup·apt)을 빼면 `node scripts/ci/run.mjs <gate>`만 부른다(parity gate가 강제).
# 도구 버전은 scripts/ci/tools.json, Rust 툴체인은 rust-toolchain.toml이 원천이다.

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      base:
        description: "changes 기준 커밋(비우면 모든 작업을 돌린다). 문서만 바뀐 경로를 확인할 때 쓴다"
        required: false
        default: ""
        type: string

permissions: {}

concurrency:
  # PR은 새 push가 오면 이전 실행을 취소한다. master는 커밋마다 ci-ok가 남아야 한다(릴리스 gate)
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # reqwest(rustls) → aws-lc-sys가 Windows에서 nasm 없이 빌드되도록 prebuilt 오브젝트를 쓴다
  AWS_LC_SYS_PREBUILT_NASM: "1"

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # checkout
    outputs:
      code: ${{ steps.classify.outputs.code }}
      release: ${{ steps.classify.outputs.release }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - id: classify
        name: classify
        run: node scripts/ci/run.mjs changes
        env:
          CHANGES_BASE: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base }}
          CHANGES_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # scan-history가 모든 커밋을 보려면 얕은 클론이면 안 된다
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: rust toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: typos@1.50.3,zizmor@1.30.1
      - name: install actionlint
        run: node scripts/ci/run.mjs install-tool actionlint
      # 앞 단계가 실패해도 나머지 gate의 결과를 모두 보이도록 각 단계는 !cancelled()로 돈다
      - name: scan
        if: ${{ !cancelled() }}
        run: node scripts/ci/run.mjs scan
      - name: scan-history
        if: ${{ !cancelled() }}
        run: node scripts/ci/run.mjs scan-history
      - name: fixtures
        if: ${{ !cancelled() }}
        run: node scripts/ci/run.mjs fixtures
      - name: fmt
        if: ${{ !cancelled() }}
        run: node scripts/ci/run.mjs fmt
      - name: typos
        if: ${{ !cancelled() }}
        run: node scripts/ci/run.mjs typos
      - name: workflows
        if: ${{ !cancelled() }}
        run: node scripts/ci/run.mjs workflows
      - name: versions
        if: ${{ !cancelled() }}
        run: node scripts/ci/run.mjs versions
      - name: parity
        if: ${{ !cancelled() }}
        run: node scripts/ci/run.mjs parity
      - name: scripts-test
        if: ${{ !cancelled() }}
        run: node scripts/ci/run.mjs scripts-test
      - name: selftest
        if: ${{ !cancelled() }}
        run: node scripts/ci/run.mjs selftest

  scripts-windows:
    name: scripts (windows)
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read # checkout
    steps:
      # Windows 러너가 fixture를 CRLF로 바꾸면 바이트 비교가 깨진다
      - name: disable autocrlf
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: scan
        if: ${{ !cancelled() }}
        run: node scripts/ci/run.mjs scan
      - name: fixtures
        if: ${{ !cancelled() }}
        run: node scripts/ci/run.mjs fixtures
      - name: scripts-test
        if: ${{ !cancelled() }}
        run: node scripts/ci/run.mjs scripts-test

  supply:
    name: supply
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # msrv가 chzzk-app(wry·webkit2gtk)까지 check한다
      - name: linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target"
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-deny@0.20.2,cargo-machete@0.9.2,cargo-hack@0.6.45
      - name: deny
        if: ${{ !cancelled() }}
        run: node scripts/ci/run.mjs deny
      - name: machete
        if: ${{ !cancelled() }}
        run: node scripts/ci/run.mjs machete
      - name: msrv
        if: ${{ !cancelled() }}
        run: node scripts/ci/run.mjs msrv

  rust:
    name: rust (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read # checkout
    steps:
      # Windows 러너가 fixture·bindings를 CRLF로 바꾸면 바이트 비교·crc golden이 깨진다
      - name: disable autocrlf
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target"
          save-if: ${{ github.ref == 'refs/heads/master' }}
      # tests/bindings.rs가 app/src/lib/bindings가 최신인지도 검사한다
      - name: rust
        run: node scripts/ci/run.mjs rust

  frontend:
    name: frontend
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # packageManager 필드가 루트가 아니라 app/package.json에 있다
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: frontend
        run: node scripts/ci/run.mjs frontend

  tauri:
    name: tauri (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read # checkout
    steps:
      - name: disable autocrlf
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # wry(webkit2gtk 4.1)·tray·clipboard 링크에 필요한 개발 패키지
      - name: linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target"
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: tauri
        run: node scripts/ci/run.mjs tauri

  # 필수 체크는 이 작업 하나다(ruleset). 작업 이름·matrix가 바뀌어도 보호 설정은 그대로다.
  ci-ok:
    name: ci-ok
    needs: [changes, lint, scripts-windows, supply, rust, frontend, tauri]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: ci-ok
        run: node scripts/ci/run.mjs ci-ok
        env:
          NEEDS: ${{ toJSON(needs) }}
