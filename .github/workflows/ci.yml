name: ci

# docs/design/cicd.md §2. 경로 필터를 두지 않는다: 필수 체크 ci-ok가 항상 보고되도록
# changes 작업이 바뀐 경로를 영역(app·worker, gates.mjs AREA_SKIP)으로 나눠 그 영역이 안 바뀐 무거운 작업만 건너뛴다(문서만 바뀌면
# lint만, worker만 바뀌면 lint와 worker 작업만 돈다). 두 영역이 함께 읽는 파일·모르는 경로는 둘 다 켠다. 건너뛰기는 pull_request에서만
# 일어난다: push·dispatch는 CHANGES_BASE가 비어 늘 전부 돌므로, master의 녹색 ci-ok는 그 커밋을 빌드했다는 뜻이다.
# 모든 run:은 setup(autocrlf·rustup·apt)을 빼면 `node scripts/ci/run.mjs <gate>`만 부른다(parity gate가 강제).
# 도구 버전은 scripts/ci/tools.json, Rust 툴체인은 rust-toolchain.toml이 원천이다.
# bundle 작업은 릴리스 설정(release/tauri.release.json, 임시 키, collect --release)으로 만든다(release-build gate, release.yml과
# 같다). Linux 번들·설치 스모크는 app 영역이 바뀐 PR에서도 돌아 릴리스 빌드를 깨는 PR이 녹색으로 머지되지 않는다(리뷰 G6).
# macOS·Windows 번들은 push master·dispatch에서만 돈다. report는 ci-ok 뒤에 master 실패 이슈를 열고 닫는다(docs/design/cicd.md §4).

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      force_fail:
        description: "고리 확인용: 무거운 작업을 건너뛰고 ci-ok를 실패시킨다"
        type: boolean
        default: false
      loop_test:
        description: "고리 확인용: 이 dispatch 실행에서도 report(master-failure 이슈 열기·닫기)를 돌린다"
        type: boolean
        default: false

permissions: {}

concurrency:
  # PR은 새 push가 오면 이전 실행을 취소한다. master는 커밋마다 ci-ok가 남아야 한다(릴리스 gate)
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # reqwest(rustls) → aws-lc-sys가 Windows에서 nasm 없이 빌드되도록 prebuilt 오브젝트를 쓴다
  AWS_LC_SYS_PREBUILT_NASM: "1"
  # dev·test 프로필의 디버그 정보를 줄 번호만 남긴다(구현 중 변경 78): 링크(특히 Windows PDB)·캐시가 작아진다. 판정에는
  # 영향이 없다(panic·backtrace의 파일:줄은 남는다, 릴리스 프로필은 그대로). nightly.yml과 같은 값이라 rust-cache 키가 맞는다
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # checkout
    outputs:
      app: ${{ steps.classify.outputs.app }}
      worker: ${{ steps.classify.outputs.worker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - id: classify
        name: classify
        run: node scripts/ci/run.mjs changes
        env:
          # pull_request에서만 기준을 준다. 비면 run.mjs changes가 전부 실행(fail-safe)한다
          CHANGES_BASE: ${{ github.event.pull_request.base.sha }}
          CHANGES_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          # dispatch 입력 force_fail: 모든 영역 false로 무거운 작업을 건너뛰어 ci-ok가 실패한다(고리 확인용)
          CI_FORCE_FAIL: ${{ inputs.force_fail }}

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # scan-history가 모든 커밋을 보려면 얕은 클론이면 안 된다
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: rust toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: typos@1.50.3,zizmor@1.30.1
          # manifest에 없는 버전을 cargo-binstall로 몰래 받지 않고 실패한다(parity가 강제)
          fallback: none
      - name: install actionlint
        run: node scripts/ci/run.mjs install-tool actionlint
      # 앞 단계가 실패해도 나머지 gate의 결과를 모두 보이도록 각 단계는 !cancelled()로 돈다
      - name: scan
        if: ${{ !cancelled() }}
        run: node scripts/ci/run.mjs scan
      - name: scan-history
        if: ${{ !cancelled() }}
        run: node scripts/ci/run.mjs scan-history
      - name: subjects
        if: ${{ !cancelled() }}
        run: node scripts/ci/run.mjs subjects
      - name: fixtures
        if: ${{ !cancelled() }}
        run: node scripts/ci/run.mjs fixtures
      - name: fmt
        if: ${{ !cancelled() }}
        run: node scripts/ci/run.mjs fmt
      - name: typos
        if: ${{ !cancelled() }}
        run: node scripts/ci/run.mjs typos
      - name: workflows
        if: ${{ !cancelled() }}
        run: node scripts/ci/run.mjs workflows
      - name: versions
        if: ${{ !cancelled() }}
        run: node scripts/ci/run.mjs versions
      - name: pubkey
        if: ${{ !cancelled() }}
        run: node scripts/ci/run.mjs pubkey
      - name: parity
        if: ${{ !cancelled() }}
        run: node scripts/ci/run.mjs parity
      - name: fuzz-lock
        if: ${{ !cancelled() }}
        run: node scripts/ci/run.mjs fuzz-lock
      - name: ratchet-log
        if: ${{ !cancelled() }}
        run: node scripts/ci/run.mjs ratchet-log
        env:
          # PR은 기준 브랜치, push는 직전 master. 비면(dispatch) 건너뛴다
          RATCHET_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: scripts-test
        if: ${{ !cancelled() }}
        run: node scripts/ci/run.mjs scripts-test
      - name: selftest
        if: ${{ !cancelled() }}
        run: node scripts/ci/run.mjs selftest

  scripts-windows:
    name: scripts (windows)
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read # checkout
    steps:
      # Windows 러너가 fixture를 CRLF로 바꾸면 바이트 비교가 깨진다
      - name: disable autocrlf
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: scan
        if: ${{ !cancelled() }}
        run: node scripts/ci/run.mjs scan
      - name: fixtures
        if: ${{ !cancelled() }}
        run: node scripts/ci/run.mjs fixtures
      - name: scripts-test
        if: ${{ !cancelled() }}
        run: node scripts/ci/run.mjs scripts-test

  supply:
    name: supply
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # msrv가 chzzk-app(wry·webkit2gtk)까지 check한다
      - name: linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target"
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-deny@0.20.2,cargo-machete@0.9.2,cargo-hack@0.6.45
          fallback: none
      - name: deny
        if: ${{ !cancelled() }}
        run: node scripts/ci/run.mjs deny
      - name: machete
        if: ${{ !cancelled() }}
        run: node scripts/ci/run.mjs machete
      - name: msrv
        if: ${{ !cancelled() }}
        run: node scripts/ci/run.mjs msrv

  rust:
    name: rust (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.app == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read # checkout
    steps:
      # Windows 러너가 fixture·bindings를 CRLF로 바꾸면 바이트 비교·crc golden이 깨진다
      - name: disable autocrlf
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target"
          save-if: ${{ github.ref == 'refs/heads/master' }}
      # tests/bindings.rs가 app/src/lib/bindings가 최신인지도 검사한다
      - name: rust
        run: node scripts/ci/run.mjs rust
      # 릴리스 경로(xtask: 서명·업로드·승격·검증·되돌리기)를 가짜 S3에 합성 산출물로 3 OS에서 돌린다(docs/design/cicd.md §5.8)
      - name: release-selftest
        if: ${{ !cancelled() }}
        run: node scripts/ci/run.mjs release-selftest

  frontend:
    name: frontend
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # packageManager 필드가 루트가 아니라 app/package.json에 있다
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: frontend
        run: node scripts/ci/run.mjs frontend

  # Cloudflare Worker(docs/design/worker.md §13.3, cicd.md 구현 중 변경 83): 설치·불변식(worker-config)·wrangler types+tsc·
  # vitest(Workers 런타임, 가짜 값만)·deploy --dry-run 번들. Worker는 workerd에서 돌아 OS 하나(Linux)로 충분하다.
  # 자격증명은 쓰지 않는다(dry-run은 계정이 필요 없다). 테스트 수는 ratchet tests.worker(write --from-run이 artifact를 받는다).
  worker:
    name: worker
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # worker/는 app/과 따로인 pnpm 루트다(같은 pnpm 버전, 독립 lockfile)
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: worker/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: worker/pnpm-lock.yaml
      - name: worker
        run: node scripts/ci/run.mjs worker
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: ratchet-measurements-worker
          path: target/ci/measure/tests.json
          retention-days: 7
          if-no-files-found: ignore

  # chzzk-app clippy(보통·--features e2e)를 test·빌드와 다른 작업으로 돌린다(구현 중 변경 78): clippy(check)와 test(codegen)는
  # 산출물을 나누지 않아 한 작업에서는 두 전체 컴파일이 직렬이었다(Windows 약 3.5분 + 4.3분).
  tauri-clippy:
    name: tauri-clippy (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.app == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read # checkout
    steps:
      - name: disable autocrlf
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # wry(webkit2gtk 4.1)·tray·clipboard의 개발 패키지(check에도 pkg-config가 찾는다)
      - name: linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target"
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: tauri-clippy
        run: node scripts/ci/run.mjs tauri-clippy

  tauri:
    name: tauri (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.app == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read # checkout
    steps:
      - name: disable autocrlf
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # wry(webkit2gtk 4.1)·tray·clipboard 링크에 필요한 개발 패키지, smoke-bin의 xvfb-run
      - name: linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb xauth
      - name: rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target"
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: tauri
        run: node scripts/ci/run.mjs tauri
      # chzzk-app 테스트 수 ratchet(tests.app.<os>). tauri gate의 테스트 빌드를 다시 쓴다. tauri-build보다 먼저 돈다: tauri CLI가
      # 빌드에 주는 환경 변수(macOS MACOSX_DEPLOYMENT_TARGET 등)가 cc 빌드 스크립트를 다시 돌게 해 테스트 빌드가 무효가 된다
      - name: test-count-app
        if: ${{ !cancelled() }}
        run: node scripts/ci/run.mjs test-count-app
      - name: tauri-build
        run: node scripts/ci/run.mjs tauri-build
      # 방금 만든 debug 바이너리를 --smoke로 띄운다(dist 로드·CSP·IPC, 60초 안 exit 0 + 마커)
      - name: smoke-bin
        run: node scripts/ci/run.mjs smoke-bin
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: ratchet-measurements-tests-app-${{ matrix.os }}
          path: target/ci/measure/tests.json
          retention-days: 7
          if-no-files-found: ignore

  # 커버리지·테스트 수 ratchet(ci/ratchet.json). 측정값은 artifact로 남겨 ratchet.mjs write --from-run이 읽는다
  coverage:
    name: coverage
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target"
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-llvm-cov@0.9.1
          fallback: none
      # 목록(test-count)이 계측 빌드를 먼저 만들고 coverage가 그것을 다시 쓴다
      - name: test-count
        if: ${{ !cancelled() }}
        run: node scripts/ci/run.mjs test-count
      - name: coverage
        if: ${{ !cancelled() }}
        run: node scripts/ci/run.mjs coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: ratchet-measurements-coverage
          path: |
            target/ci/measure/coverage.json
            target/ci/measure/tests.json
          retention-days: 7
          if-no-files-found: ignore

  # 웹 E2E(docs/design/cicd.md §6): Playwright + 프로덕션 dist + mockIPC 가짜 백엔드 + axe. D14 관찰 중이라 ci-ok에 없고
  # (gates.mjs OBSERVED_JOBS) master에서 실패하면 report가 master-failure 이슈를 연다. 실패하면 trace를 남긴다.
  e2e-web:
    name: e2e-web
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: e2e-web
        run: node scripts/ci/run.mjs e2e-web
      # 실패한 테스트의 trace·스크린샷(retain-on-failure). 통과하면 폴더가 비어 올리지 않는다
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: e2e-web-trace
          path: target/e2e-web/results/
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: ratchet-measurements-tests-playwright
          path: target/ci/measure/tests.json
          retention-days: 7
          if-no-files-found: ignore

  # Worker wrangler dev E2E(docs/design/worker.md §12.3, 구현 중 변경 40·41, cicd.md 구현 중 변경 100): 가짜 치지직(node:http) +
  # wrangler dev(--env-file .dev.vars.example, 로컬 R2 씨앗)에 실제 HTTP로 로그인·회전·updater·R2·관리 흐름과 로그 카나리.
  # D14 관찰 중이라 ci-ok에 없고(gates.mjs OBSERVED_JOBS) master에서 실패하면 report가 master-failure 이슈를 연다.
  # 실패하면 wrangler 로그(합성 값뿐)를 남긴다.
  worker-e2e:
    name: worker-e2e
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: worker/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: worker/pnpm-lock.yaml
      - name: worker-e2e
        run: node scripts/ci/run.mjs worker-e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: worker-e2e-log
          path: target/ci/worker-e2e/
          retention-days: 7
          if-no-files-found: ignore

  # 네이티브 E2E(Linux, docs/design/cicd.md §6): --features e2e 앱 + tauri-driver(WebKitWebDriver, xvfb) + 로컬 fixture 서버.
  # 코드가 바뀐 PR·push master·dispatch에서 돈다(머지 전에 네이티브 신호를 받는다). D14 관찰 중(OBSERVED_JOBS, 편입하면
  # CODE_GATED_JOBS로 옮겨 PR 필수 체크가 된다). 끝에 hygiene-seed가 release-hygiene의 검사가 이 e2e 빌드를
  # 실제로 알아보는지 증명한다. Windows는 아래 e2e-native-windows, nightly.yml이 매일(Linux)·매주(Windows) 같은 gate를 돌린다.
  e2e-native:
    name: e2e-native (linux)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # webkit2gtk-driver: WebKitWebDriver(tauri-driver의 네이티브 드라이버)
      - name: linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb xauth webkit2gtk-driver
      - name: rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target"
          # nightly.yml e2e-native-linux와 같은 gate·OS·env라 캐시 하나를 같이 쓴다(구현 중 변경 78, 10 GB 한도)
          shared-key: e2e-native-linux
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: install tauri-driver
        run: node scripts/ci/run.mjs install-tool tauri-driver
      - name: e2e-native
        run: node scripts/ci/run.mjs e2e-native
      - name: hygiene-seed
        if: ${{ !cancelled() }}
        run: node scripts/ci/run.mjs hygiene-seed
      # 실패 진단(스크린샷·페이지 HTML·드라이버·앱 로그, 합성 fixture뿐)과 판정 결과
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: e2e-native-linux
          path: target/ci/e2e-native/
          retention-days: 7
          if-no-files-found: ignore

  # 네이티브 E2E(Windows, 구현 중 변경 79): 실제 Windows 앱(WebView2) + tauri-driver + 러너 이미지의 msedgedriver.
  # WebView2 런타임과 드라이버 버전이 다르면 받지 않고 실패한다(e2e-native.mjs). Linux 작업과 같은 조건(코드 PR·push master·
  # dispatch)이고 같은 D14 관찰 규칙이다(OBSERVED_JOBS, ci-ok 밖이라 PR의 ci-ok 경로를 늘리지 않는다, master 실패는 report).
  # nightly.yml e2e-native-windows(매주·dispatch, 러너 이미지 drift)와 같은 gate·캐시 키다.
  e2e-native-windows:
    name: e2e-native (windows)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: windows-latest
    timeout-minutes: 75
    permissions:
      contents: read # checkout
    steps:
      - name: disable autocrlf
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target"
          # nightly.yml e2e-native-windows와 같은 gate·OS·env라 캐시 하나를 같이 쓴다(구현 중 변경 78·79)
          shared-key: e2e-native-windows
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: install tauri-driver
        run: node scripts/ci/run.mjs install-tool tauri-driver
      # msedgedriver는 러너 이미지의 것(EDGEWEBDRIVER)만 쓴다. WebView2 런타임과 버전이 다르면 실패한다(e2e-native.mjs)
      - name: e2e-native
        run: node scripts/ci/run.mjs e2e-native
      - name: hygiene-seed
        if: ${{ !cancelled() }}
        run: node scripts/ci/run.mjs hygiene-seed
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: e2e-native-windows
          path: target/ci/e2e-native/
          retention-days: 7
          if-no-files-found: ignore

  # 릴리스 번들(Linux, 릴리스 설정). glibc 하한을 위해 ubuntu 22.04 컨테이너에서 만든다. 설치 스모크는 24.04 호스트(smoke-install-linux).
  # 코드가 바뀐 PR에서도 돈다(CODE_GATED_JOBS): 릴리스 설정·collect --release·updater 서명·크기 기준을 머지 전에 본다
  bundle-linux:
    name: bundle (linux)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:22.04@sha256:5ec03bb3441e8b0bf3b4f9cd4629a1ae763010dc3035bb8da3ae6cf026486401
    timeout-minutes: 75
    permissions:
      contents: read # checkout
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      # git이 없으면 checkout이 .git 없는 tarball로 받는다(versions·cargo metadata는 되지만 일관성을 위해 깐다)
      - name: container deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl wget file xdg-utils \
            build-essential pkg-config libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: rustup
        run: node scripts/ci/run.mjs install-rustup
      - name: rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target"
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: release-build
        run: node scripts/ci/run.mjs release-build
      - name: glibc-floor
        if: ${{ !cancelled() }}
        run: node scripts/ci/run.mjs glibc-floor
      - name: release-hygiene
        if: ${{ !cancelled() }}
        run: node scripts/ci/run.mjs release-hygiene
      - name: size
        if: ${{ !cancelled() }}
        run: node scripts/ci/run.mjs size
      # 서명 전 번들. 공개 저장소의 artifact는 로그인한 누구나 받으므로 하루만 둔다(cicd.md §9)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-linux
          path: target/ci/bundle/
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: ratchet-measurements-size-linux
          path: target/ci/measure/size.json
          retention-days: 7
          if-no-files-found: ignore

  smoke-install-linux:
    name: smoke-install (linux)
    needs: [changes, bundle-linux]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    # smoke.mjs installBudgetMs('linux')(약 27분) + 준비. smoke.test.mjs가 비교한다
    timeout-minutes: 30
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # AppImage는 GL 스택(libEGL·libGLESv2·mesa)을 번들하지 않고 사용자 시스템 것을 쓴다(데스크톱에는 있다). deb는 apt가 의존성을 깐다
      - name: linux deps
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libegl1 libgles2 libegl-mesa0 libgl1-mesa-dri
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundle-linux
          path: target/ci/bundle
      - name: smoke-install
        run: node scripts/ci/run.mjs smoke-install

  # 릴리스 번들(macOS·Windows, 릴리스 설정): 만들고 → 위생·크기 → 설치 스모크까지 한 작업에서 한다(push master·dispatch)
  bundle:
    name: bundle (${{ matrix.os }})
    needs: changes
    if: github.event_name != 'pull_request' && needs.changes.outputs.app == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    permissions:
      contents: read # checkout
    steps:
      - name: disable autocrlf
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target"
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: release-build
        run: node scripts/ci/run.mjs release-build
      - name: release-hygiene
        if: ${{ !cancelled() }}
        run: node scripts/ci/run.mjs release-hygiene
      - name: size
        if: ${{ !cancelled() }}
        run: node scripts/ci/run.mjs size
      # 설치기가 멈춰도 로그가 남도록 단계에도 시간 제한을 둔다(작업 취소는 로그를 잃는다).
      # smoke.mjs의 명령별 시간 제한 합(installBudgetMs, macOS 릴리스 36분·Windows 27분)보다 커야 안쪽 제한이 먼저
      # 걸린다(smoke.test.mjs, release.yml build도 같은 값)
      - name: smoke-install
        if: ${{ !cancelled() }}
        timeout-minutes: 40
        run: node scripts/ci/run.mjs smoke-install
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: bundle-${{ matrix.os }}
          path: target/ci/bundle/
          retention-days: 1
          if-no-files-found: ignore
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: ratchet-measurements-size-${{ matrix.os }}
          path: target/ci/measure/size.json
          retention-days: 7
          if-no-files-found: ignore

  # 필수 체크는 이 작업 하나다(ruleset). 작업 이름·matrix가 바뀌어도 보호 설정은 그대로다.
  # needs는 ci.yml의 다른 모든 작업이다(parity가 강제).
  ci-ok:
    name: ci-ok
    needs: [changes, lint, scripts-windows, supply, rust, frontend, worker, tauri-clippy, tauri, coverage, bundle-linux, smoke-install-linux, bundle]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # checkout
    steps:
      # 저장소 코드를 받기 전에 식만으로 판정한다. run.mjs(PR이 고칠 수 있는 코드)가 망가져도 이 단계가 막는다.
      # push·dispatch는 skipped를 하나도 허용하지 않는다. pull_request는 macOS·Windows bundle(MASTER_ONLY_JOBS)의 skipped와,
      # 그 작업의 영역 출력(CODE_GATED_JOBS)이 'false'일 때 무거운 작업의 skipped만 허용한다. 이 식은 parity가 글자 그대로 요구한다.
      - name: guard
        if: >-
          needs.changes.result != 'success' || needs.lint.result != 'success'
          || needs.scripts-windows.result != 'success'
          || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
          || (github.event_name != 'pull_request' && contains(needs.*.result, 'skipped'))
          || (needs.changes.outputs.app != 'false'
          && (needs.supply.result == 'skipped' || needs.rust.result == 'skipped' || needs.frontend.result == 'skipped' || needs.tauri-clippy.result == 'skipped' || needs.tauri.result == 'skipped' || needs.coverage.result == 'skipped' || needs.bundle-linux.result == 'skipped' || needs.smoke-install-linux.result == 'skipped'))
          || (needs.changes.outputs.worker != 'false'
          && (needs.worker.result == 'skipped'))
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: ci-ok
        run: node scripts/ci/run.mjs ci-ok
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          CI_FORCE_FAIL: ${{ inputs.force_fail }}

  # 닫힌 고리(docs/design/cicd.md §4.1·§4.4): master의 ci-ok 결과로 master-failure 이슈를 열고 닫고, 예약 워크플로가
  # 꺼졌으면 다시 켜고(keep-alive), 72시간 넘게 성공이 없으면 nightly-stale 이슈를 연다. ci-ok에서 뺀 작업이다(parity CI_OK_EXEMPT).
  report:
    name: report
    # e2e-web·e2e-native(linux·windows)·worker-e2e는 D14 관찰 중이라 ci-ok에 없지만 master에서 실패하면 이 작업이 master-failure 이슈를 연다
    needs: [ci-ok, e2e-web, e2e-native, e2e-native-windows, worker-e2e]
    if: always() && ((github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event_name == 'workflow_dispatch' && inputs.loop_test))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # 커밋마다 따로 둔다: 한 그룹에 대기 작업은 하나뿐이라 공유하면 늦게 온 (옛 커밋의) 보고가 머리 커밋의 대기 보고를
    # 취소한다. 머리가 아닌 커밋의 보고는 아무것도 하지 않으므로(issue.mjs) 서로 다른 커밋의 보고가 겹쳐도 하나만 쓴다.
    concurrency:
      group: ci-report-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: read # checkout
      issues: write # 고리 이슈 열기·댓글·닫기, label 만들기
      actions: write # 실행의 작업 목록 읽기, 60일 비활성으로 꺼진 예약 워크플로 다시 켜기
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: report
        run: node scripts/ci/run.mjs report
        env:
          GH_TOKEN: ${{ github.token }}
          CI_OK_RESULT: ${{ needs.ci-ok.result }}
          NEEDS: ${{ toJSON(needs) }}
