name: core

on:
  push:
    branches: [master]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "testdata/**"
      - ".github/workflows/core.yml"
      - ".gitattributes"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "testdata/**"
      - ".github/workflows/core.yml"
      - ".gitattributes"

permissions:
  contents: read

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # reqwest(rustls) → aws-lc-sys는 Windows x86_64에서 PATH에 nasm이 없으면 빌드가 실패한다.
  # 이 변수가 있으면 nasm이 없을 때 crate에 든 prebuilt 오브젝트를 쓴다(nasm이 있거나 다른 OS면 무시).
  AWS_LC_SYS_PREBUILT_NASM: "1"

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Windows 러너가 fixture를 CRLF로 바꾸면 바이트 비교·crc golden이 깨진다
      - name: Disable autocrlf
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy -p chzzk-core --all-targets --locked -- -D warnings
      - name: test
        run: cargo test -p chzzk-core --locked
