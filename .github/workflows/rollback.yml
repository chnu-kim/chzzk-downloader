name: rollback

# 수동 되돌리기·다시 올리기(docs/design/cicd.md §5.7). releases/latest.json을 입력한 버전으로 바꾼다: 그 버전의 객체를 다시 받아
# 해시·서명·스키마를 확인 → latest.json을 그 버전의 manifest.json으로 CAS 교체 → 다시 확인. none이면 latest.json을 지운다
# (첫 릴리스 전 상태). 더 높은 버전을 넣으면 잘못 되돌린 릴리스를 다시 올린다. 환경 release의 시크릿을 쓴다(배포 정책: 태그 v*와
# master). 시크릿 작업은 컴파일하지 않는다(xtask 작업의 바이너리를 sha256으로 맞춘 뒤 부른다, D10).
# concurrency는 실행마다다: 대기 중인 되돌리기가 다른 실행에 밀려 조용히 취소되지 않게 한다. 동시에 돌아도 latest.json은 CAS로만 바뀐다.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "되돌릴 버전(X.Y.Z, releases/<v>/가 있어야 한다) 또는 none"
        type: string
        required: true

permissions: {}

concurrency:
  group: rollback-${{ github.run_id }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  xtask:
    name: rollback xtask
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # checkout
    outputs:
      sha256: ${{ steps.xtask.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # 릴리스는 캐시를 쓰지 않는다(§7 릴리스 격리, zizmor cache-poisoning)
          package-manager-cache: false
      - name: rust toolchain
        run: rustup toolchain install
      - id: xtask
        name: release-xtask
        run: node scripts/ci/run.mjs release-xtask
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xtask-bin-${{ github.run_id }}
          path: target/ci/xtask-bin/
          retention-days: 1
          if-no-files-found: error

  rollback:
    name: rollback
    needs: xtask
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # 릴리스는 캐시를 쓰지 않는다(§7 릴리스 격리, zizmor cache-poisoning)
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: xtask-bin-${{ github.run_id }}
          path: target/ci/xtask-bin
      - name: release-rollback
        run: node scripts/ci/run.mjs release-rollback
        env:
          RELEASE_MODE: tag
          ROLLBACK_VERSION: ${{ inputs.version }}
          XTASK_BIN: target/ci/xtask-bin/xtask
          XTASK_SHA256: ${{ needs.xtask.outputs.sha256 }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          DIST_BASE_URL: ${{ vars.DIST_BASE_URL }}
