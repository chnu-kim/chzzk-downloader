# typos 설정(docs/design/cicd.md §2 `typos` gate). 오탐은 이유와 함께 여기에 적는다.

[files]
extend-exclude = [
  # 합성 fixture: 바이트 그대로 고정한 데이터
  "testdata/",
  # 공유 KAT(base64url 값 고정, worker.md 구현 중 변경 89)
  "worker/test/vectors/",
  # 해시 목록
  "scripts/ci/public-denylist.txt",
  "*.lock",
  "app/pnpm-lock.yaml",
  "worker/pnpm-lock.yaml",
  "worker/deploy/pnpm-lock.yaml",
  # 생성물(ts-rs bindings)
  "app/src/lib/bindings/",
]

[default.extend-words]
# MP4 상자 이름(ISO/IEC 14496-12)
trak = "trak"
trun = "trun"
# MP4 메타데이터 '©nam'(제목) 상자 흉내
nam = "nam"

[default]
# 생성된 CSS 해시(SITE_CSS_HASH): 16진수 열이 우연히 낱말처럼 읽힌다. CSS가 바뀔 때마다 값이 달라진다
extend-ignore-re = ['SITE_CSS_HASH = "[0-9a-f]{16}"']
