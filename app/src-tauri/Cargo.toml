[package]
name = "chzzk-app"
version.workspace = true
description = "치지직 다운로더 데스크톱 앱 (Tauri 셸)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "chzzk_app_lib"
crate-type = ["rlib"]

[features]
# 네이티브 E2E 빌드 전용(src/e2e.rs, docs/design/cicd.md §6). 릴리스·번들 빌드는 켜지 않는다(release-hygiene가 확인한다).
e2e = ["dep:url"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = [] }
tauri-plugin-dialog = "2.8.1"
tauri-plugin-opener = "2.7.0"
tauri-plugin-notification = "2.5.1"
tauri-plugin-clipboard-manager = "2.4.1"
chzzk-core = { path = "../../crates/core" }
chzzk-shell = { path = "../../crates/shell" }
tokio = { version = "1.53.2", default-features = false, features = ["rt", "sync"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "env-filter", "fmt", "registry", "std"] }
url = { version = "2.5.8", optional = true }

[dev-dependencies]
tauri = { version = "2.12.1", features = ["test"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
url = "2.5.8"
wiremock = "0.6.5"
tokio = { version = "1.53.2", default-features = false, features = ["macros", "rt", "rt-multi-thread", "sync"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.5.2"
