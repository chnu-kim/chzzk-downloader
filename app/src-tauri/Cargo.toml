[package]
name = "chzzk-app"
version.workspace = true
description = "치지직 다운로더 데스크톱 앱 (Tauri 셸)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# serde_json은 generate_context! 매크로 전개에서만 쓰여 cargo-machete가 보지 못한다
[package.metadata.cargo-machete]
ignored = ["serde_json"]

[lib]
name = "chzzk_app_lib"
crate-type = ["rlib"]

[features]
# 네이티브 E2E 빌드 전용(src/e2e.rs, docs/design/cicd.md §6). 릴리스·번들 빌드는 켜지 않는다(release-hygiene가 확인한다).
e2e = ["dep:url"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = [] }
tauri-plugin-dialog = "2.8.1"
tauri-plugin-opener = "2.7.0"
tauri-plugin-notification = "2.5.1"
tauri-plugin-clipboard-manager = "2.4.1"
chzzk-core = { path = "../../crates/core" }
chzzk-shell = { path = "../../crates/shell" }
# tauri::generate_context!()가 tauri.conf.json의 plugins(updater pubkey)를 serde_json 값으로 펼친다
serde_json = "1.0.151"
tokio = { version = "1.53.2", default-features = false, features = ["rt", "sync", "time"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "env-filter", "fmt", "registry", "std"] }
url = { version = "2.5.8", optional = true }

[dev-dependencies]
tauri = { version = "2.12.1", features = ["test"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
url = "2.5.8"
wiremock = "0.6.5"
time = { version = "0.3.55", default-features = false, features = ["std"] }
tokio = { version = "1.53.2", default-features = false, features = ["macros", "rt", "rt-multi-thread", "sync"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.5.2"
tauri-plugin-updater = "2.13.1"
# 창 위치·크기·최대화 복원(Rust 전용, JS 권한 없음). 2.5.0은 배포 14일째라 한 단계 아래 2.4.1에 고정한다(=)
tauri-plugin-window-state = "=2.4.1"

# Windows 릴리스 WebView2 보강(webview_win.rs). 버전은 wry와 같다
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows = "0.62.2"
