[package]
name = "chzzk-app"
version = "0.1.0"
description = "치지직 다운로더 데스크톱 앱 (Tauri 셸)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "chzzk_app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = [] }
tauri-plugin-dialog = "2.8.1"
tauri-plugin-opener = "2.7.0"
tauri-plugin-notification = "2.5.1"
tauri-plugin-clipboard-manager = "2.4.1"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.2", default-features = false, features = ["rt"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.5.2"
