[package]
name = "chzzk-core"
version.workspace = true
description = "치지직 VOD·클립 다운로드 코어 (Tauri 비의존)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "chzzk_core"

[dependencies]
bytes = "1.12.1"
crc32fast = "1.5.2"
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json"] }
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", default-features = false, features = ["rt", "macros", "time", "sync"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"
