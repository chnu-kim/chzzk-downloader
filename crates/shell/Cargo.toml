[package]
name = "chzzk-shell"
version.workspace = true
description = "치지직 다운로더 앱 셸 로직 (Tauri 비의존): 작업 관리·DTO·오류 매핑"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "chzzk_shell"

[dependencies]
base64 = "0.23.1"
chzzk-core = { path = "../core" }
getrandom = "0.3.4"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
time = { version = "0.3.55", default-features = false, features = ["std", "parsing", "formatting"] }
tokio = { version = "1.53.2", default-features = false, features = ["rt", "sync", "time"] }
tracing = "0.1.44"
ts-rs = "12.0.1"
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "registry", "std"] }
wiremock = "0.6.5"
tokio = { version = "1.53.2", default-features = false, features = ["macros", "rt", "rt-multi-thread", "sync", "time", "test-util"] }
