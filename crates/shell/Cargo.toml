[package]
name = "chzzk-shell"
version = "0.1.0"
description = "치지직 다운로더 앱 셸 로직 (Tauri 비의존): 작업 관리·DTO·오류 매핑"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "chzzk_shell"

[dependencies]
chzzk-core = { path = "../core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ts-rs = "12.0.1"

[dev-dependencies]
tempfile = "3.27.0"
reqwest = { version = "0.13.5", default-features = false }
url = "2.5.8"
tokio = { version = "1.53.2", default-features = false, features = ["macros", "rt", "sync", "time", "test-util"] }
