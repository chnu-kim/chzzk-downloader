[package]
name = "chzzk-shell"
version.workspace = true
description = "VOD 클립 다운로더 앱 셸 로직 (Tauri 비의존): 작업 관리·DTO·오류 매핑"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "chzzk_shell"

[dependencies]
base64 = "0.23.1"
chzzk-core = { path = "../core" }
getrandom = "0.3.4"
# 잠자기 방지(power.rs 한 곳, DX15). 기본 기능(bin)은 CLI용이라 끈다
keepawake = { version = "0.6.1", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
time = { version = "0.3.55", default-features = false, features = ["std", "parsing", "formatting"] }
tokio = { version = "1.53.2", default-features = false, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tracing = "0.1.44"
ts-rs = "12.0.1"
url = "2.5.8"

# 볼륨 파일 시스템 종류 감지(volume.rs): statfs
[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

# macOS 전용: App Nap 해제(power.rs)·클립보드 접근 정책(pasteboard.rs). lock에 이미 있는 Tauri 간접 의존의 버전이다
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSProcessInfo", "NSString"] }

[dev-dependencies]
tempfile = "3.27.0"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "registry", "std"] }
wiremock = "0.6.5"
tokio = { version = "1.53.2", default-features = false, features = ["macros", "rt", "rt-multi-thread", "sync", "time", "test-util"] }
